name: Build Focus-Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build_apk.yml'

jobs:
  build:
    name: Build Telegram 13.1.1 APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Free Disk Space
        run: |
          echo "Freeing disk space..."
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android/sdk/ndk/*
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          df -h

      - name: Checkout repository and submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android NDK and CMake
        run: |
          echo "Installing NDK 27.2.12479018 and CMake 3.22.1..."
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bison gcc g++ make ninja-build ccache

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build APK with Gradle
        run: |
          ./gradlew :TMessagesProj_AppStandalone:assembleArm64Debug --stacktrace

      - name: Locate Generated APKs
        run: |
          echo "Looking for generated APKs..."
          find . -name "*.apk" -ls

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: Focus-Android-13.1.1-debug
          path: "**/build/outputs/apk/**/*.apk"
          if-no-files-found: error
