name: Sync Upstream 13.1.1
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/sync_upstream.yml'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch and push DrKLO/Telegram master to main
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git clone --bare https://x-access-token:${{ secrets.GH_PAT }}@github.com/${{ github.repository }}.git repo.git
          cd repo.git
          git remote add upstream https://github.com/DrKLO/Telegram.git
          echo "Fetching DrKLO/Telegram master..."
          git fetch upstream master
          echo "Pushing upstream/master to main branch..."
          git push origin refs/remotes/upstream/master:refs/heads/main --force
          echo "Sync completed successfully!"
